# Single-package repo. This field is redundant for pnpm 10+, which reads this file as
# its settings file, but pnpm 9 treats any pnpm-workspace.yaml as a workspace root and
# fails with "packages field missing or empty" without it — which is what Vercel runs
# unless corepack is enabled.
packages:
  - '.'

allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  # Optional native accelerator of firebase-tools. Denied on purpose: firebase-tools
  # ships re2js (pure JS) as a regular dependency and works without it, nothing in the
  # build imports firebase-tools at all, and leaving it undecided fails the install with
  # ERR_PNPM_IGNORED_BUILDS.
  re2: false
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.64.0'
  - '@typescript-eslint/parser@8.64.0'
  - '@typescript-eslint/project-service@8.64.0'
  - '@typescript-eslint/scope-manager@8.64.0'
  - '@typescript-eslint/tsconfig-utils@8.64.0'
  - '@typescript-eslint/type-utils@8.64.0'
  - '@typescript-eslint/types@8.64.0'
  - '@typescript-eslint/typescript-estree@8.64.0'
  - '@typescript-eslint/utils@8.64.0'
  - '@typescript-eslint/visitor-keys@8.64.0'
  - typescript-eslint@8.64.0
